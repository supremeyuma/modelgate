name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --python 3.12
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy --strict src/modelgate
      - name: Tests
        run: uv run pytest --cov=modelgate --cov-report=term-missing --cov-fail-under=85
