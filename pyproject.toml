[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelgate"
version = "0.1.0"
description = "Training, statistical promotion and drift monitoring for demand forecasts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "mlflow>=2.17",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "joblib>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML",
]

[project.scripts]
modelgate = "modelgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelgate"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["lightgbm.*", "mlflow.*", "duckdb.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "slow: long-running tests that CI opts into",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["modelgate"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
